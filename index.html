<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Film / Dizi Takip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">🎬</span>
                <div>
                    <h1>Film / Dizi Takip</h1>
                    <p class="subtitle">Koleksiyonunu yönet, izlediklerini takip et</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-outline" id="export-btn" title="Yakında">⚙️</button>
            </div>
        </header>

        <!-- İstatistik Kartları -->
        <section class="stats-row">
            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div class="stat-info">
                    <span class="stat-label">Toplam</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <span class="stat-label">İzlenen</span>
                    <span class="stat-value" id="stat-watched">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-info">
                    <span class="stat-label">İzlenecek</span>
                    <span class="stat-value" id="stat-towatch">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-info">
                    <span class="stat-label">Ortalama Puan</span>
                    <span class="stat-value" id="stat-avg-rating">-</span>
                </div>
            </div>
        </section>

        <!-- İlerleme çubuğu -->
        <section class="progress-section">
            <div class="progress-header">
                <span>İzleme İlerlemesi</span>
                <span id="progress-text">%0</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </section>

        <!-- Kontroller -->
        <section class="controls">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Başlık ara...">
            </div>
            <div class="filter-group">
                <label>Durum:</label>
                <div class="btn-group">
                    <button class="filter-btn active" data-filter="all">Tümü</button>
                    <button class="filter-btn" data-filter="izlenecek">İzlenecek</button>
                    <button class="filter-btn" data-filter="izlendi">İzlendi</button>
                </div>
            </div>
            <div class="filter-group">
                <label>Kategori:</label>
                <select id="category-filter" class="select-custom">
                    <option value="all">Tümü</option>
                    <option value="Aksiyon">Aksiyon</option>
                    <option value="Komedi">Komedi</option>
                    <option value="Dram">Dram</option>
                    <option value="Bilim Kurgu">Bilim Kurgu</option>
                    <option value="Korku">Korku</option>
                    <option value="Romantik">Romantik</option>
                    <option value="Belgesel">Belgesel</option>
                    <option value="Animasyon">Animasyon</option>
                    <option value="Diğer">Diğer</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Sırala:</label>
                <select id="sort-select" class="select-custom">
                    <option value="newest">En Yeni</option>
                    <option value="oldest">En Eski</option>
                    <option value="rating-desc">Puan (Yüksekten)</option>
                    <option value="rating-asc">Puan (Düşükten)</option>
                </select>
            </div>
        </section>

        <!-- Form -->
        <section class="form-card">
            <h2 id="form-title">➕ Yeni Kayıt Ekle</h2>
            <form id="movie-form">
                <input type="hidden" id="edit-id" value="">
                <div class="form-row">
                    <div class="form-group">
                        <label for="title">Başlık</label>
                        <input type="text" id="title" required placeholder="Film veya dizi adı">
                    </div>
                    <div class="form-group">
                        <label for="media-type">Tür</label>
                        <select id="media-type">
                            <option value="film">🎬 Film</option>
                            <option value="dizi">📺 Dizi</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Kategori</label>
                        <select id="category">
                            <option value="Aksiyon">Aksiyon</option>
                            <option value="Komedi">Komedi</option>
                            <option value="Dram">Dram</option>
                            <option value="Bilim Kurgu">Bilim Kurgu</option>
                            <option value="Korku">Korku</option>
                            <option value="Romantik">Romantik</option>
                            <option value="Belgesel">Belgesel</option>
                            <option value="Animasyon">Animasyon</option>
                            <option value="Diğer">Diğer</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="status">Durum</label>
                        <select id="status">
                            <option value="izlenecek">⏳ İzlenecek</option>
                            <option value="izlendi">✅ İzlendi</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rating">Puan (1-10)</label>
                        <input type="number" id="rating" min="1" max="10" placeholder="Opsiyonel">
                    </div>
                    <div class="form-group">
                        <label for="poster">Poster URL</label>
                        <input type="url" id="poster" placeholder="https://...">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:2;">
                        <label for="note">Not</label>
                        <textarea id="note" placeholder="Düşüncelerin..."></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">💾 Kaydet</button>
                    <button type="button" id="cancel-edit" class="btn-secondary" style="display:none;">İptal</button>
                </div>
            </form>
        </section>

        <!-- Liste -->
        <section id="movie-list" class="movie-grid"></section>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
